[project]
name = "organella"
# Read from organella.__version__ by hatchling (see [tool.hatch.version])
dynamic = ["version"]
description ="Spatial analysis of segmented objects: measure a batch of them, and read the result in one standalone page"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Helmholtz Imaging Engineering & Support Unit MDC" },
]
keywords = [
    "segmentation", "morphometry", "microscopy", "electron microscopy", "FIB-SEM",
    "organelles", "image analysis", "parquet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "click>=8.1",
    "numpy>=2.0.0",
    "pyarrow",
    "polars>=1.0.0",
    "scipy>=1.13.0",
    "scikit-image>=0.23.0",
    "SimpleITK>=2.3",
    "tifffile>=2024.5.0",
    "imagecodecs",
    "edt>=2.4.0",
    "fast-simplification>=0.1.6",
    "kimimaro>=4.0.0",
    "psutil",
]

[project.urls]
Homepage = "https://ida-mdc.github.io/organella/"
Repository = "https://github.com/ida-mdc/organella"
Issues = "https://github.com/ida-mdc/organella/issues"

[project.optional-dependencies]
remote = [
    "zarr>=2.16,<3",
    "s3fs>=2023.6.0",
]

test = [
    "pytest>=8.3.5",
    "duckdb>=1.0",
]

[project.scripts]
organella = "organella.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.version]
path = "src/organella/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/organella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
