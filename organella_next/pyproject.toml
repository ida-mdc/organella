[project]
name = "organella"
dynamic = ["version"]
description = "Spatial analysis of segmented objects, scaled with dask"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1",
    "dask[array]>=2025.1",
    "zarr[remote]>=3",
    "tensorstore",
    "tifffile>=2024.5",
    "imagecodecs",
    "edt>=2.4",
    "kimimaro>=4",
    "fast-simplification>=0.1.6",
    "scikit-image>=0.23",
    "SimpleITK>=2.3",
    "polars>=1.0",
    "pyarrow",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
organella = "organella.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/organella/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/organella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
