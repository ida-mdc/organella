name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The report page is JavaScript, and parts of the suite run it through node: the way a
      # report is read into the page, the geometry decoder, the merge arithmetic, the contact
      # clustering, every query the geometry sections build, and every section drawn against a
      # stub DOM. Without node those tests fail rather than skip.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Nothing to pin: the package's dependencies are all released, since the report is
      # written and read by the package itself.
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install -e . pytest

      - name: Test
        run: .venv/bin/python -m pytest -q
