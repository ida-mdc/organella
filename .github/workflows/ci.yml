name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push cancels the run it superseded: the suite is the slow part of a review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what pyproject asks for at the lowest; 3.12 is what it is developed on.
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The report page is JavaScript, and the suite checks it with node: which file may read which
      # (acorn and eslint-scope), and the page drawn in headless Chrome, which the runner provides.
      # Without node and its packages those tests fail; they do not skip.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node tools for the viewer tests
        run: npm ci
        working-directory: tools/viewer

      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install -e '.[test]'

      - name: Test
        run: .venv/bin/python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Only the rules that catch a mistake, not a preference: an undefined name, an
      # unused import, a syntax error. The prose in this package is deliberate and the
      # docstring and complexity rules would argue with it on every file.
      - name: Ruff
        run: uvx ruff check --select F,E9 src tests

  install:
    # The three platforms the package claims - pyproject says "Operating System ::
    # OS Independent" - built, installed and run the way somebody installing it gets it.
    # Added because an install on Windows failed: the test job runs on Linux against the
    # source tree, which is the one arrangement that cannot see a dependency with no
    # Windows wheel, a path built the wrong way round, or a console that cannot print an
    # arrow.
    name: install and run (${{ matrix.os }})
    strategy:
      # Every platform reports. The question this job answers is *which* ones differ, so
      # one of them failing must not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # One shell for all three, so there is one script here to read, not three.
    # Windows runners provide bash, and every path below is written the way it accepts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build

      # 3.12 only: the test job covers 3.11 as well, and what this one is about is the
      # platform, which the interpreter does not change. `fresh` is empty, so what lands in it is the
      # wheel's own dependency list and nothing a development checkout happens to have.
      - name: An empty environment to install into
        run: |
          uv venv --seed --python 3.12 fresh
          # Relative, with forward slashes, and .exe where there is one: bash here is MSYS
          # and hands out $PWD as /d/a/..., which a native Windows binary cannot read.
          if [ -d fresh/Scripts ]; then dir=fresh/Scripts; exe=.exe; else dir=fresh/bin; exe=; fi
          echo "PY=$dir/python$exe" >> "$GITHUB_ENV"
          echo "ORG=$dir/organella$exe" >> "$GITHUB_ENV"

      # The page is built from files inside the package, and the suite reads them out of the source
      # tree - so a wheel built without them passes every test and still installs a CLI whose
      # `view` and `page` have nothing to open.
      - name: The wheel carries the report page
        run: |
          "$PY" - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          inside = zipfile.ZipFile(wheel).namelist()
          for needed in ("organella/viewer/index.html", "organella/viewer/load-order.txt", "organella/viewer/assets/masthead.png"):
              assert needed in inside, (needed, inside)
          print(f"{wheel} carries the page")
          EOF

      # The step the Windows report came down to. A dependency that cannot build on a
      # platform fails here and nowhere else.
      #
      # pip, run by the interpreter it is installing into, with no uv --python
      # path: `pip install organella` is what the README tells a reader to do, and nothing
      # here then has to hand a path from MSYS bash to a native Windows binary.
      - name: Install it
        run: |
          "$PY" -m pip install --disable-pip-version-check "$(ls dist/*.whl)"

      - name: A batch to measure, in 3D and in 2D
        run: |
          "$PY" tests/synthetic.py make 3d batch
          "$PY" tests/synthetic.py make 2d batch2d

      - name: Survey it
        run: |
          "$ORG" dry-run batch -p control -p treated --object-mask pm

      # dry-run's whole job is to say what is wrong with a batch, so it is run against one
      # that has something wrong with it: a structure present in three objects of four.
      - name: Survey a batch with a structure missing from one object
        run: |
          cp -r batch partial
          rm partial/control/object_a/*nucleus*
          "$ORG" dry-run partial -p control -p treated --object-mask pm

      # Not only on Windows, so the check is the same everywhere and does not depend on
      # which code page a runner happens to boot with. A Windows console is the reason it
      # is here: Python encodes stdout with the active code page, and cp1252 has no arrow,
      # so a line carrying one ends the command in a UnicodeEncodeError and never says
      # what it was about to say.
      - name: The same, on a console that is not UTF-8
        env:
          PYTHONIOENCODING: cp1252
        run: |
          "$ORG" dry-run partial -p control -p treated --object-mask pm
          "$ORG" mesh batch -p control -p treated -o geometry-cp1252 --object-mask pm

      # The whole pipeline: the chunked measurements, kimimaro for the skeletons, the meshes, and a
      # parquet at the end.
      - name: Measure it
        run: |
          "$ORG" process batch -p control -p treated -o report.parquet \
            --object-mask pm --object-noun cell \
            --with-mesh --skeletons mito --distance-histograms

      # Measured, not merely written: every number in the report is compared with what numpy and scipy say of the arrays
      # the batch was made from, and the geometry file of each object is opened. The 2D batch goes the same way.
      - name: The report says what the arrays say
        run: |
          "$PY" tests/synthetic.py check 3d report.parquet
          "$ORG" process batch2d -p control -p treated -o report2d.parquet --object-mask pm --object-noun cell \
            --with-mesh --skeletons mito
          "$PY" tests/synthetic.py check 2d report2d.parquet

      # Both rewrite the parquet where it already is. On Windows a file cannot be replaced
      # while something still holds it open, which is a failure no Linux run can produce.
      - name: Colour and describe the report in place
        run: |
          "$PY" -c "import json, pathlib; pathlib.Path('palette.json').write_text(json.dumps({'mito': '#d62728'}))"
          "$ORG" colours report.parquet palette.json
          "$ORG" describe report.parquet "Synthetic batch, from CI."

      # --resume reads back the per-object parts, and a finished run removes the directory
      # they were in.
      - name: Measure it again, resuming
        run: |
          "$ORG" process batch -p control -p treated -o resumed.parquet --object-mask pm --resume
          "$ORG" process batch -p control -p treated -o resumed.parquet --object-mask pm --resume

      - name: The installed CLI finds its page
        run: |
          "$ORG" page
          "$PY" -c "from organella.viewer.build import build; page = build(); assert page.lstrip().lower().startswith('<!doctype html'), page[:80]"
