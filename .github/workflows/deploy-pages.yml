name: Deploy the report page to GitHub Pages

# The report is read by one standalone HTML page: it loads a report.parquet in the browser
# and draws every chart from it. `organella page` assembles it from the files of the viewer
# folder, and it is served at / and at /organella_report.html.

on:
  push:
    branches: [main]
    paths:
      - 'src/organella/viewer/**'
      - 'tools/viewer/**'
      - 'docs/**'
      - 'tests/synthetic.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node, because the page is checked before it is published: which file may read which, and the
      # page drawn in headless Chrome, which is the only thing standing between a typo in it and
      # whoever opens the published copy.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node tools for the viewer tests
        run: npm ci
        working-directory: tools/viewer

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install -e '.[test]'

      - name: Check the page reads a report and draws every section
        run: .venv/bin/python -m pytest -q tests/test_viewer.py

      - name: Publish the page
        run: |
          mkdir -p _site
          page=$(.venv/bin/organella page)
          cp "$page" _site/organella_report.html
          cp "$page" _site/index.html

      # Two small datasets with known answers, measured here and published with their geometry, so the page can be tried
      # without any data of one's own: <page>/?data=examples/synthetic-3d.parquet
      - name: Publish the synthetic example reports
        run: |
          for dim in 3d 2d; do
            .venv/bin/python tests/synthetic.py make $dim "batch-$dim"
            .venv/bin/organella process "batch-$dim" -p control -p treated -o "_site/examples/synthetic-$dim.parquet" \
              --object-mask pm --object-noun cell --skeletons mito --with-mesh \
              --description "Synthetic $dim cells, two groups of two, made by organella's own tests (tests/synthetic.py): a ragged outline, a nucleus, a Golgi crescent, mitochondria and granules. Every number in it is checked against the arrays. Not biology."
            .venv/bin/python tests/synthetic.py check $dim "_site/examples/synthetic-$dim.parquet"
          done

      - name: Publish the imprint and the privacy policy
        run: cp docs/impressum.html docs/privacy.html docs/_legal.css _site/

      - name: Show what will be published
        run: ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
